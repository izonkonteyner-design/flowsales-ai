name: Dependency Remediation

on:
  push:
    branches:
      - feat/ai-sales-agent-foundation
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'security: generate remediated dependency lock')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-sales-agent-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched Next.js release
        run: npm install --save-exact next@16.2.12 eslint-config-next@16.2.12

      - name: Apply compatible transitive security fixes
        run: npm audit fix

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate npm dependency advisories"
          git push origin HEAD:feat/ai-sales-agent-foundation
