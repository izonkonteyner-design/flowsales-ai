name: repair-demo-uuid

on:
  push:
    branches:
      - fix/demo-organization-uuid

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace invalid demo organization id
        shell: bash
        run: |
          set -euo pipefail
          target='server/services/crm-data.ts'
          old='org_demo_001'
          new='d3e00000-0000-0000-0000-000000000000'
          test -f "$target"
          grep -q 'id: "org_demo_001"' "$target"
          python - <<'PY'
          from pathlib import Path
          p = Path('server/services/crm-data.ts')
          s = p.read_text()
          old = 'id: "org_demo_001"'
          new = 'id: "d3e00000-0000-0000-0000-000000000000"'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one demo organization id, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'id: "d3e00000-0000-0000-0000-000000000000"' "$target"

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/services/crm-data.ts
          git rm .github/workflows/repair-demo-uuid.yml
          git commit -m 'fix(demo): use seeded demo organization UUID'
          git push
