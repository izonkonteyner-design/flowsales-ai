name: Supabase Production Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-production-migrate.yml
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify migrations through 0034
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate migration set
        shell: bash
        run: |
          set -euo pipefail
          for version in 0027 0028 0029 0030 0031 0032 0033 0034; do
            compgen -G "supabase/migrations/${version}_*.sql" >/dev/null || { echo "Missing migration ${version}" >&2; exit 1; }
          done

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply missing ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          db_url="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}}"
          [[ "$db_url" == postgresql://* || "$db_url" == postgres://* ]] || { echo "Production PostgreSQL URI is not configured." >&2; exit 1; }
          for file in supabase/migrations/00{27,28,29,30,31,32,33,34}_*.sql; do
            version="$(basename "$file" | cut -d_ -f1)"
            applied="$(psql "$db_url" -X -Atqc "select exists(select 1 from public.deployment_migrations where version='${version}');")"
            if [[ "$applied" == "t" ]]; then
              echo "Already applied ${version}"
            else
              echo "Applying ${version}"
              psql "$db_url" -v ON_ERROR_STOP=1 -X -1 -f "$file"
            fi
          done

      - name: Verify WhatsApp production schema and permissions
        shell: bash
        run: |
          set -euo pipefail
          db_url="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}}"
          latest="$(psql "$db_url" -X -Atqc "select max(version) from public.deployment_migrations;")"
          test "$latest" = "0034"
          psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "
            select case when
              exists (select 1 from public.deployment_migrations where version='0032' and name='0032_whatsapp_inbound_conversations.sql')
              and exists (select 1 from information_schema.columns where table_schema='public' and table_name='conversations' and column_name='unread_count')
              and exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='persist_whatsapp_inbound_message' and p.prosecdef)
              and has_function_privilege('service_role', 'public.persist_whatsapp_inbound_message(uuid,uuid,text,text,text,text,text,timestamptz,jsonb,jsonb)', 'EXECUTE')
              and not has_function_privilege('anon', 'public.persist_whatsapp_inbound_message(uuid,uuid,text,text,text,text,text,timestamptz,jsonb,jsonb)', 'EXECUTE')
              and not has_function_privilege('authenticated', 'public.persist_whatsapp_inbound_message(uuid,uuid,text,text,text,text,text,timestamptz,jsonb,jsonb)', 'EXECUTE')
            then 'ready' else 'not_ready' end;
          " | grep -qx ready
          echo "Production Supabase migration verified at 0034."
