name: Supabase Production Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-production-migrate.yml
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify migrations through 0053 and 0060
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate migration set and guard against destructive DDL
        shell: bash
        run: |
          set -euo pipefail
          ordered_versions=(0027 0028 0029 0030 0031 0032 0033 0034 0035 0036 0037 0038 0039 0040 0041 0042 0043 0044 0045 0046 0047 0048 0049 0050 0051 0052 0053 0054 0055 0060 0061 0062)
          for version in "${ordered_versions[@]}"; do
            matches=(supabase/migrations/${version}_*.sql)
            if [[ ! -e "${matches[0]}" || "${#matches[@]}" -ne 1 ]]; then
              echo "Missing or duplicate migration file for version ${version}" >&2
              exit 1
            fi
          done
          for file in supabase/migrations/0054_email_crm_activities.sql supabase/migrations/0055_social_media_publishing.sql supabase/migrations/0060_fix_social_media_tenant.sql; do
            if grep -Eiq '\b(drop\s+table|drop\s+schema|truncate\s+table)\b' "$file"; then
              echo "Forbidden destructive DDL detected in ${file}" >&2
              exit 1
            fi
          done

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply missing ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          db_url="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}}"
          [[ "$db_url" == postgresql://* || "$db_url" == postgres://* ]] || { echo "Production PostgreSQL URI is not configured." >&2; exit 1; }

          prereq="$(psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "
            select case when
              to_regclass('public.deployment_migrations') is not null
              and to_regclass('public.organizations') is not null
              and to_regclass('public.organization_members') is not null
              and to_regclass('public.leads') is not null
              and to_regclass('public.contacts') is not null
              and to_regclass('public.quotes') is not null
            then 'ok' else 'drift' end;
          ")"
          if [[ "$prereq" != "ok" ]]; then
            echo "Schema drift detected: required core CRM tables or deployment_migrations table missing." >&2
            exit 1
          fi

          unexpected="$(psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "
            select coalesce(string_agg(version, ',' order by version), '')
            from public.deployment_migrations
            where version not in (
              '0018','0019','0020','0021','0022',
              '0024','0025','0026','0027','0028','0029','0030','0031','0032','0033',
              '0034','0035','0036','0037','0038','0039','0040','0041','0042','0043',
              '0044','0045','0046','0047','0048','0049','0050','0051','0052','0053',
              '0054','0055','0060','0061','0062'
            );
          ")"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected migration versions found in public.deployment_migrations: ${unexpected}" >&2
            exit 1
          fi

          ordered_files=(
            supabase/migrations/0027_*.sql
            supabase/migrations/0028_*.sql
            supabase/migrations/0029_*.sql
            supabase/migrations/0030_*.sql
            supabase/migrations/0031_*.sql
            supabase/migrations/0032_*.sql
            supabase/migrations/0033_*.sql
            supabase/migrations/0034_*.sql
            supabase/migrations/0035_*.sql
            supabase/migrations/0036_*.sql
            supabase/migrations/0037_*.sql
            supabase/migrations/0038_*.sql
            supabase/migrations/0039_*.sql
            supabase/migrations/0040_*.sql
            supabase/migrations/0041_*.sql
            supabase/migrations/0042_*.sql
            supabase/migrations/0043_*.sql
            supabase/migrations/0044_*.sql
            supabase/migrations/0045_*.sql
            supabase/migrations/0046_*.sql
            supabase/migrations/0047_*.sql
            supabase/migrations/0048_*.sql
            supabase/migrations/0049_*.sql
            supabase/migrations/0050_*.sql
            supabase/migrations/0051_*.sql
            supabase/migrations/0052_*.sql
            supabase/migrations/0053_email_workspace.sql
            supabase/migrations/0054_email_crm_activities.sql
            supabase/migrations/0055_social_media_publishing.sql
            supabase/migrations/0060_fix_social_media_tenant.sql
            supabase/migrations/0061_social_multiplatform_and_company_profile.sql
            supabase/migrations/0062_channel_connections_youtube.sql
          )

          for file in "${ordered_files[@]}"; do
            version="$(basename "$file" | cut -d_ -f1)"
            applied="$(psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "select exists(select 1 from public.deployment_migrations where version='${version}');")"
            if [[ "$applied" == "t" ]]; then
              echo "Already applied ${version} ($(basename "$file"))"
            else
              echo "Applying ${version} ($(basename "$file"))"
              psql "$db_url" -v ON_ERROR_STOP=1 -X -1 -f "$file"
              recorded="$(psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "select exists(select 1 from public.deployment_migrations where version='${version}');")"
              if [[ "$recorded" != "t" ]]; then
                echo "Migration ${version} did not record completion in public.deployment_migrations" >&2
                exit 1
              fi
            fi
          done

      - name: Verify sales operations, growth, and social publishing schema
        shell: bash
        run: |
          set -euo pipefail
          db_url="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}}"
          latest="$(psql "$db_url" -X -Atqc "select max(version) from public.deployment_migrations;")"
          # Baseline gate test "$latest" = "0053" advanced to 0060 and 0062
          test "$latest" = "0062"
          psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc "
            select case when
              exists (select 1 from public.deployment_migrations where version='0047' and name='0047_voice_sales_v1.sql')
              and exists (select 1 from public.deployment_migrations where version='0048' and name='0048_sales_operations_v5.sql')
              and exists (select 1 from public.deployment_migrations where version='0049' and name='0049_sales_growth_v6.sql')
              and exists (select 1 from public.deployment_migrations where version='0050' and name='0050_onboarding_roles.sql')
              and exists (select 1 from public.deployment_migrations where version='0051' and name='0051_readiness_entitlements_fix.sql')
              and exists (select 1 from public.deployment_migrations where version='0052' and name='0052_contact_identity_guard_fix.sql')
              and exists (select 1 from public.deployment_migrations where version='0053' and name='email_workspace')
              and exists (select 1 from public.deployment_migrations where version='0054' and name='email_crm_activities')
              and exists (select 1 from public.deployment_migrations where version='0055' and name='social_media_publishing')
              and exists (select 1 from public.deployment_migrations where version='0060' and name='fix_social_media_tenant')
              and exists (select 1 from public.deployment_migrations where version='0061' and name='social_multiplatform_and_company_profile')
              and exists (select 1 from public.deployment_migrations where version='0062' and name='channel_connections_youtube')
              and to_regclass('public.email_connections') is not null
              and to_regclass('public.email_threads') is not null
              and to_regclass('public.email_messages') is not null
              and to_regclass('public.contacts') is not null
              and to_regclass('public.social_posts') is not null
              and to_regclass('public.social_publishing_queue') is not null
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname='public' and c.relname='social_posts' and c.relrowsecurity = true)
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname='public' and c.relname='social_publishing_queue' and c.relrowsecurity = true)
              and exists (select 1 from pg_constraint where conname='social_queue_post_org_fk' and conrelid='public.social_publishing_queue'::regclass)
              and exists (select 1 from pg_trigger where tgname='trg_normalize_social_post_tenant' and tgrelid='public.social_posts'::regclass)
              and exists (select 1 from pg_trigger where tgname='trg_sync_queue_organization' and tgrelid='public.social_publishing_queue'::regclass)
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_posts' and policyname='social_posts_select_member')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_posts' and policyname='social_posts_insert_writer')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_posts' and policyname='social_posts_update_writer')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_publishing_queue' and policyname='social_queue_select_member')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_publishing_queue' and policyname='social_queue_insert_writer')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='social_publishing_queue' and policyname='social_queue_update_writer')
              and to_regprocedure('public.claim_due_social_posts(integer)') is not null
              and not has_function_privilege('anon', 'public.claim_due_social_posts(integer)', 'EXECUTE')
              and not has_function_privilege('authenticated', 'public.claim_due_social_posts(integer)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.claim_due_social_posts(integer)', 'EXECUTE')
              and pg_get_functiondef('public.guard_duplicate_lead_identity()'::regprocedure) like '%public.contacts%'
              and to_regclass('public.voice_calls') is not null
              and to_regclass('public.sales_callback_queue') is not null
              and to_regclass('public.sales_call_dispositions') is not null
              and to_regclass('public.sales_objection_library') is not null
              and to_regclass('public.lead_intent_history') is not null
              and to_regclass('public.sales_sequence_templates') is not null
              and to_regclass('public.sales_sequence_steps') is not null
              and to_regclass('public.sales_sequence_enrollments') is not null
              and to_regclass('public.quote_follow_up_state') is not null
              and to_regclass('public.sales_automation_drafts') is not null
              and to_regclass('public.sales_sla_policies') is not null
              and to_regclass('public.sales_routing_rules') is not null
              and to_regclass('public.quote_discount_approvals') is not null
              and to_regclass('public.quote_versions') is not null
              and to_regclass('public.sales_growth_opportunities') is not null
              and to_regclass('public.pipeline_snapshots') is not null
              and exists (select 1 from information_schema.columns where table_schema='public' and table_name='products' and column_name='unit_cost')
              and exists (select 1 from information_schema.columns where table_schema='public' and table_name='quote_items' and column_name='cost_snapshot')
              and exists (select 1 from information_schema.columns where table_schema='public' and table_name='organizations' and column_name='timezone')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='sales_callback_queue' and policyname='members_read_sales_callback_queue')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='lead_intent_history' and policyname='members_read_lead_intent_history')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='quote_discount_approvals' and policyname='members_read_quote_discount_approvals')
              and exists (select 1 from pg_policies where schemaname='public' and tablename='pipeline_snapshots' and policyname='members_read_pipeline_snapshots')
              and to_regprocedure('public.resolve_voice_phone_identity(uuid,text)') is not null
              and to_regprocedure('public.create_user_notification(uuid,uuid,text,text,text,text)') is not null
            then 'ready' else 'not_ready' end;
          " | grep -qx ready
          echo "Production Supabase migration verified through 0053 and 0060."
