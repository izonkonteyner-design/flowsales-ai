name: WhatsApp Template Finalization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp-template-finalize.yml
      - scripts/finalize-whatsapp-template.mjs
  workflow_dispatch:

concurrency:
  group: whatsapp-template-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check live Meta template and finalize once if approved
        run: node scripts/finalize-whatsapp-template.mjs
